<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GEMOTS TEST V7 — Compte</title>
<style>
body{font:16px system-ui,Arial,sans-serif;background:#eef8f5;color:#183c47;margin:0;padding:32px 16px}main{max-width:440px;margin:32px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 3px 18px #1232}h1{text-align:center}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px}input{border:1px solid #aab9be;margin-top:7px}button{border:0;background:#68d9b9;color:#123b3a;font-weight:700;margin-top:20px}button:disabled{opacity:.5}#status{line-height:1.5}small{color:#51666c}
</style>
</head>
<body><main>
<h1>GEMOTS</h1><h2 id="title">Vérification du lien</h2>
<p><small>Projet GEMOTS_TEST_V7 uniquement</small></p>
<p id="status" role="status">Vérification en cours…</p>
<form id="form" hidden>
<label>Nouveau mot de passe<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirmer le mot de passe<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
<button id="submit" type="submit">Enregistrer le nouveau mot de passe</button>
</form>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://ixzzexxmyrtyquyoddqw.supabase.co',
  'sb_publishable_TFpGbpUNLg5vx-Dr6yiUtw_w7BGTswe',
  {auth:{detectSessionInUrl:false,persistSession:false,autoRefreshToken:false}}
);
const title = document.getElementById('title');
const status = document.getElementById('status');
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const hash = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
const type = hash.get('type') || query.get('type');
const tokenHash = query.get('token_hash');
const accessToken = hash.get('access_token');
const refreshToken = hash.get('refresh_token');
const recovery = type === 'recovery' || (!type && !!tokenHash);
const signup = type === 'signup' || type === 'email';

async function verifyLink(){
  if(location.search || location.hash)history.replaceState(null,'',location.pathname);
  if(hash.has('error') || hash.has('error_code') || query.has('error') || query.has('error_code')){
    throw new Error('Lien invalide ou expiré. Demande un nouveau lien dans GEMOTS.');
  }
  if(!signup && !recovery)throw new Error('Ouvre le lien reçu par e-mail.');
  title.textContent = recovery ? 'Récupération du mot de passe' : 'Confirmation de l’adresse e-mail';

  let result;
  if(tokenHash){
    result = await supabase.auth.verifyOtp({token_hash:tokenHash,type:recovery ? 'recovery' : 'email'});
  }else if(accessToken && refreshToken){
    result = await supabase.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
  }
  if(result?.error || !result?.data?.session){
    throw new Error('Lien invalide ou expiré. Demande un nouveau lien dans GEMOTS.');
  }
  if(signup){
    if(!result.data.user?.email_confirmed_at)throw new Error('Ton adresse n’a pas pu être confirmée.');
    status.textContent = 'Ton adresse est confirmée. Retourne dans GEMOTS pour te connecter.';
    return;
  }
  status.textContent = 'Choisis un nouveau mot de passe (8 caractères minimum).';
  form.hidden = false;
}

try{
  await verifyLink();
}catch(error){
  status.textContent = error.message;
}

form.addEventListener('submit',async event=>{
  event.preventDefault();
  const password = document.getElementById('password').value;
  if(password !== document.getElementById('confirm').value){
    status.textContent = 'Les mots de passe sont différents.';
    return;
  }
  submit.disabled = true;
  status.textContent = 'Enregistrement en cours…';
  try{
    const {error} = await supabase.auth.updateUser({password});
    if(error)throw error;
    form.reset();
    form.hidden = true;
    status.textContent = 'Mot de passe modifié. Tu peux retourner dans GEMOTS TEST V7 et te connecter.';
    await supabase.auth.signOut();
  }catch(error){
    status.textContent = 'Erreur : ' + (error?.message || 'réessaie');
    submit.disabled = false;
  }
});
</script></body></html>
