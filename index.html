<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEMOTS TEST V7 — Récupération</title>
<style>
body{font:16px system-ui,Arial,sans-serif;background:#eef8f5;color:#183c47;margin:0;padding:32px 16px}main{max-width:440px;margin:32px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 3px 18px #1232}h1{text-align:center}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px}input{border:1px solid #aab9be;margin-top:7px}button{border:0;background:#68d9b9;color:#123b3a;font-weight:700;margin-top:20px}button:disabled{opacity:.5}#status{line-height:1.5}small{color:#51666c}</style>
</head>
<body><main><h1>GEMOTS</h1><h2>Récupération du mot de passe</h2><p><small>Projet GEMOTS_TEST_V7 uniquement</small></p>
<p id="status" role="status">Vérification du lien de récupération…</p>
<form id="form" hidden><label>Nouveau mot de passe<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmer le mot de passe<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button id="submit" type="submit">Enregistrer le nouveau mot de passe</button></form>
</main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://ixzzexxmyrtyquyoddqw.supabase.co','sb_publishable_TFpGbpUNLg5vx-Dr6yiUtw_w7BGTswe',{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
const status=document.getElementById('status'),form=document.getElementById('form'),submit=document.getElementById('submit');
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
const recoveryLink=hash.get('type')==='recovery'||query.get('type')==='recovery'||!!query.get('token_hash');
const setStatus=s=>status.textContent=s;
try{
  if(!recoveryLink)throw new Error('Ouvre le lien de récupération reçu par e-mail.');
  let session;
  if(query.get('token_hash')){
    const result=await supabase.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});
    if(result.error)throw result.error;
    session=result.data.session;
  }else if(hash.get('access_token')&&hash.get('refresh_token')){
    const result=await supabase.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});
    if(result.error)throw result.error;
    session=result.data.session;
  }else{
    const result=await supabase.auth.getSession();
    if(result.error)throw result.error;
    session=result.data.session;
  }
  if(!session)throw new Error('Lien invalide ou expiré. Demande un nouveau lien.');
  history.replaceState(null,'',location.pathname);
  setStatus('Choisis un nouveau mot de passe (8 caractères minimum).');
  form.hidden=false;
}catch(e){setStatus('Récupération impossible : '+(e?.message||'lien invalide'));}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const pass=document.getElementById('password').value;
  if(pass!==document.getElementById('confirm').value){setStatus('Les mots de passe sont différents.');return;}
  submit.disabled=true;setStatus('Enregistrement en cours…');
  try{
    const {error}=await supabase.auth.updateUser({password:pass});
    if(error)throw error;
    form.hidden=true;
    setStatus('Mot de passe modifié. Tu peux retourner dans GEMOTS TEST V7 et te connecter.');
    await supabase.auth.signOut();
  }catch(err){setStatus('Erreur : '+(err?.message||'réessaie'));submit.disabled=false;}
});
</script></body></html>
